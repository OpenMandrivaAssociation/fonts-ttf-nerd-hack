<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep Hack as primary font while preferring Hack Nerd Font Mono for PUA glyphs -->
  <alias>
    <family>Hack</family>
    <prefer>
      <family>Hack</family>
      <family>Hack Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>Hack Nerd Font Mono</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
</fontconfig>
